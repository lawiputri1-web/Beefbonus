
name: Build Beef Bonus Fabric 1.21

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode mod
        uses: actions/checkout@v4

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build file JAR
        run: gradle --no-daemon clean build

      - name: Simpan JAR untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: BeefBonus-Fabric-1.21
          path: build/libs/*.jar
          if-no-files-found: error
